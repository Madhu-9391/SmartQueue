version: "3.9"

services:

  # ─── MySQL ──────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smartqueue-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Kolkata
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
      MYSQL_DATABASE: smartqueue_db
      MYSQL_USER: smartqueue
      MYSQL_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-CHANGE_ME}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Backend ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartqueue-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ml-service:
        condition: service_started
    ports:
      - "${SERVER_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/smartqueue_db?useSSL=false&serverTimezone=Asia%2FKolkata&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: smartqueue
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-CHANGE_ME}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      APP_JWT_SECRET: ${APP_JWT_SECRET:-CHANGE_ME}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86300000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_WEBSOCKET_ALLOWED_ORIGINS: ${APP_WEBSOCKET_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      APP_ML_SERVICE_URL: http://ml-service:8000
      APP_ML_SERVICE_ENABLED: ${APP_ML_SERVICE_ENABLED:-true}
      APP_BUSINESS_TIMEZONE: ${APP_BUSINESS_TIMEZONE:-Asia/Kolkata}
      SPRING_MAIL_ENABLED: ${SPRING_MAIL_ENABLED:-true}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SPRING_MAIL_FROM: ${SPRING_MAIL_FROM}
      TWILIO_ENABLED: ${TWILIO_ENABLED:-true}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_CONSULTATION_FEE: ${RAZORPAY_CONSULTATION_FEE:-200.00}
      APP_PAYMENT_REQUIRED: ${APP_PAYMENT_REQUIRED:-true}
      TZ: Asia/Kolkata
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Python ML Microservice ─────────────────────────────────
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: smartqueue-ml
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ml_models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── React Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartqueue-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysql_data:
  ml_models:
