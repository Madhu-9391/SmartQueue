# ===== APPLICATION =====
spring.application.name=SmartQueue
server.port=${SERVER_PORT:8080}

# ===== DATABASE =====
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.h2.console.enabled=false

# ===== JWT =====
app.jwt.secret=${APP_JWT_SECRET:5367566B59703373367639792F423F8428482B4D6291655468566D5A71347437}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86300000}

# ===== CORS =====
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===== WEBSOCKET =====
app.websocket.allowed-origins=${APP_WEBSOCKET_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ===== EMAIL =====
spring.mail.enabled=${SPRING_MAIL_ENABLED:false}
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.from=${SPRING_MAIL_FROM:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== TWILIO =====
twilio.enabled=${TWILIO_ENABLED:true}
twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.phone.number=${TWILIO_PHONE_NUMBER:}

# ===== RAZORPAY =====
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.consultation.fee=${RAZORPAY_CONSULTATION_FEE:200.00}
app.payment.required=${APP_PAYMENT_REQUIRED:true}

# ===== RATE LIMITING =====
app.rate.limit.booking=${APP_RATE_LIMIT_BOOKING:10}
app.rate.limit.register=${APP_RATE_LIMIT_REGISTER:5}
app.rate.limit.login=${APP_RATE_LIMIT_LOGIN:20}
# app.rate.limit.login=${APP_RATE_LIMIT_LOGIN:100000}
app.rate.limit.general=${APP_RATE_LIMIT_GENERAL:200}

# ===== CACHE =====
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# management.health.mail.enabled=false
# ===== ASYNC =====
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=500

# ===== LOGGING =====
logging.level.com.smartqueue=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.mail=DEBUG

# ===== ML SERVICE =====
app.ml.service.enabled=${APP_ML_SERVICE_ENABLED:true}
app.ml.service.url=${APP_ML_SERVICE_URL:http://localhost:8000}

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000