# Test profile — uses H2 in-memory
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false

app.jwt.secret=test-only-jwt-secret-please-change-this-value-1234567890
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:3000
app.websocket.allowed-origins=http://localhost:3000
logging.level.com.smartqueue=WARN
logging.level.org.springframework.security=WARN
app.ml.service.enabled=false
app.ml.service.url=http://localhost:8000
